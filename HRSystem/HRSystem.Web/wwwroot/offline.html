<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2a4a" />
    <title>مفيش إنترنت - إمكان HR</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               font-family: Cairo, Tahoma, Arial, sans-serif; background: #f5f7fb; color: #0f2a4a; text-align: center; }
        .box { max-width: 340px; }
        img { width: 64px; height: 64px; }
        h1 { font-size: 1.25rem; margin: 16px 0 8px; }
        p { color: #5b6b7f; line-height: 1.7; margin: 0 0 20px; }
        button { font: inherit; border: 0; border-radius: 10px; padding: 10px 24px; background: #2a78d6; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/img/emkan-mark.svg" alt="إمكان HR" />
        <h1>مفيش اتصال بالإنترنت</h1>
        <p>إمكان HR محتاج إنترنت عشان يجيب بياناتك ويسجل حضورك. اتأكد من الواي فاي أو الداتا وجرّب تاني.</p>
        <button type="button" onclick="location.reload()">جرّب تاني</button>
    </div>
</body>
</html>
